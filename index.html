<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shreni Sutra — Coming Soon</title>

  <!-- Basic SEO -->
  <meta name="description" content="Shreni Sutra — A creative collective exploring design, storytelling, and innovation. Coming soon.">
  <meta name="keywords" content="Shreni Sutra, design, storytelling, branding, creative, coming soon">
  <meta name="author" content="Shreni Sutra">

  <!-- Open Graph (Social Sharing) -->
  <meta property="og:title" content="Shreni Sutra — Coming Soon">
  <meta property="og:description" content="A creative collective exploring design, storytelling, and innovation.">
  <meta property="og:image" content="https://yourusername.github.io/repo-name/asset/a.png">
  <meta property="og:url" content="https://shrenisutra.com">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shreni Sutra — Coming Soon">
  <meta name="twitter:description" content="A creative collective exploring design, storytelling, and innovation.">
  <meta name="twitter:image" content="https://yourusername.github.io/repo-name/asset/a.png">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #080808;
      overflow: hidden;
      font-family: 'Syne', sans-serif;
    }

    .layout {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      padding: 2rem;
      z-index: 2;
    }

    .left, .right {
      display: flex;
      align-items: center;
      width: 100%;
    }
    .left { justify-content: flex-end; padding-right: 3.5rem; }
    .right { justify-content: flex-start; padding-left: 3.5rem; }

    .brand-name, .coming-soon-text {
      font-size: clamp(0.75rem, 1.3vw, 1rem);
      color: #f0ede6;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .brand-name { font-weight: 500; }
    .coming-soon-text { font-weight: 400; font-style: italic; }

    @keyframes spin { to { --angle: 360deg; } }

    .video-wrap {
      position: relative;
      width: 222px;
      height: 393px;
    }

    .glow-blur, .glow-ring {
      position: absolute;
      inset: -6px;
      border-radius: 32px;
      z-index: 0;
      background: conic-gradient(from var(--angle, 0deg), #D4537E, #EF9F27, #5DCAA5, #AFA9EC, #D4537E);
      animation: spin 4s linear infinite;
    }
    .glow-blur { filter: blur(6px); opacity: 0.6; }
    .glow-ring { inset: -2px; border-radius: 28px; z-index: 1; }

    .video-clip {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 26px;
      overflow: hidden;
      clip-path: inset(0 round 26px);
    }

    #vimeo-frame {
      display: block;
      border: none;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    /* Overlay with background image + play button */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: url('asset/a.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 1.2s ease;
    }
    #overlay.fading { pointer-events: none; opacity: 0; }

    .play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(240,237,230,0.6);
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: #f0ede6;
      margin-left: 4px;
      transition: fill 0.2s;
    }
    #overlay:hover .play-btn { border-color: #EF9F27; transform: scale(1.1); }
    #overlay:hover .play-btn svg { fill: #EF9F27; }

    #bottom-label {
      position: fixed;
      bottom: 1.5rem;
      left: 0; right: 0;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    #bottom-label p {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      color: rgba(240,237,230,0.18);
      font-weight: 300;
    }

    @media (max-width: 640px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        gap: 2rem;
        overflow-y: auto;
        padding: 3rem 1.5rem 4rem;
      }
      .left { justify-content: center; padding-right: 0; order: 1; }
      .video-wrap { order: 2; width: 190px; height: 338px; }
      .right { justify-content: center; padding-left: 0; order: 3; }
    }
  </style>
</head>
<body>

  <div class="layout">
    <div class="left"><h1 class="brand-name">Shreni Sutra</h1></div>

    <div class="video-wrap">
      <div class="glow-blur"></div>
      <div class="glow-ring"></div>
      <div class="video-clip">
        <iframe
          id="vimeo-frame"
          src="https://player.vimeo.com/video/1190022057?loop=1&muted=1&autopause=0&app_id=58479"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"
          title="Shreni Sutra">
        </iframe>
      </div>
    </div>

    <div class="right"><p class="coming-soon-text">Coming Soon</p></div>
  </div>

  <!-- Overlay with background image and play button -->
  <div id="overlay">
    <div class="play-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
    </div>
  </div>

  <div id="bottom-label"><p>shrenisutra.com</p></div>

  <script>
    function loadVimeoScript(callback) {
      var script = document.createElement('script');
      script.src = 'https://player.vimeo.com/api/player.js';
      script.onload = callback;
      document.head.appendChild(script);
    }

    loadVimeoScript(function() {
      var overlay = document.getElementById('overlay');
      var iframe  = document.getElementById('vimeo-frame');
      var player  = new Vimeo.Player(iframe);

      overlay.addEventListener('click', function() {
        player.setMuted(false);
        player.setVolume(1);
        player.play().then(function() {
          overlay.classList.add('fading');
        }).catch(function(err) {
          console.warn('Play error:', err);
          overlay.classList.add('fading');
        });
      });
    });
  </script>

</body>
</html>
